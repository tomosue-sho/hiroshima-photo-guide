{% extends 'places/base.html' %}

{% block title %}Map | Hiroshima Through Film{% endblock %}

{% block content %}

<h1 class="display-4 mb-3">Location Map</h1>

<p class="text-muted mb-4">
    Explore Hiroshima Through Film locations from the map.
</p>

<!-- LOCATION MAP -->

<div
    id="location-map"
    style="
        width: 100%;
        height: 620px;
        border-radius: 4px;
        overflow: hidden;
    "
></div>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const mapElement = document.getElementById("location-map");

    if (!mapElement) {
        return;
    }

    const locations = [
        {% for location in locations %}
        {
            name: "{{ location.name|escapejs }}",
            lat: {{ location.latitude }},
            lng: {{ location.longitude }},
            url: "{% url 'location_detail' location.id %}",
            area: "{{ location.area.name|default:''|escapejs }}"
        },
        {% endfor %}
    ];

    const map = L.map("location-map", {
        scrollWheelZoom: false
    }).setView([34.395483, 132.453592], 12);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);

    const markerGroup = L.featureGroup();

    locations.forEach(function (location) {

        const marker = L.marker([
            location.lat,
            location.lng
        ]);

        marker.bindPopup(`
            <div>
                <strong>${location.name}</strong>
                <div>${location.area}</div>
                <div style="margin-top: 8px;">
                    <a href="${location.url}">
                        View photos
                    </a>
                </div>
            </div>
        `);

        marker.addTo(markerGroup);
    });

    if (locations.length > 0) {

        markerGroup.addTo(map);

        if (locations.length === 1) {

            map.setView(
                [
                    locations[0].lat,
                    locations[0].lng
                ],
                14
            );

        } else {

            map.fitBounds(markerGroup.getBounds(), {
                padding: [40, 40]
            });

        }
    }

    /*
     * Make sure Leaflet correctly recognizes
     * the map size after the page has loaded.
     */
    setTimeout(function () {
        map.invalidateSize();
    }, 100);

});

</script>

{% endblock %}
